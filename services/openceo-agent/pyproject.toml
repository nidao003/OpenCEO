[project]
name = "openceo-agent"
version = "0.1.0"
description = "OpenCEO AI/report sidecar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6",
  "wecom-aibot-python-sdk>=0.1.0"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
